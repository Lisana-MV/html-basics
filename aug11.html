<!DOCTYPE html>
<html lang="en">
<head>
    <title>Color changer</title>
    <script src="aug11.js" defer></script>
    <style>
        .red {
            background-color: red;
            border: red;
            color: red;
        }
    </style>
</head>
<body>
    <h2>Background color changer</h2>
    <button id="redBtn" class="red">Red</button>
    <button id="greenBtn" class="Green">Red</button>
    <button id="blueBtn" class="Green">Blue</button>
    <button id="yellowBtn" class="Green">Yellow</button>
    <button id="resetBtn" class="Green">Reset</button>
</body>
</html>
